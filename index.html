
<script>
const API_URL = "http://127.0.0.1:8000/predict";

const form = document.getElementById("carForm");
const result = document.getElementById("result");
const resultPrice = document.getElementById("resultPrice");
const resultMessage = document.getElementById("resultMessage");
const resultLabel = document.getElementById("resultLabel");
const predictBtn = document.getElementById("predictBtn");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const carName = document.getElementById("name").value.trim();

    // Extract brand from the first word of the car name.
    // Example: "Maruti Swift Dzire" becomes "Maruti".
    const brand = carName.split(/\s+/)[0];

    const carData = {
        brand: brand,
        year: Number(document.getElementById("year").value),
        km_driven: Number(document.getElementById("km_driven").value),
        fuel: document.getElementById("fuel").value,
        seller_type: document.getElementById("seller_type").value,
        transmission: document.getElementById("transmission").value,
        owner: document.getElementById("owner").value
    };

    if (carData.year < 1992 || carData.year > 2020) {
        alert("Enter a manufacturing year between 1992 and 2020.");
        return;
    }

    if (carData.km_driven < 1 || carData.km_driven > 806599) {
        alert("Enter kilometres between 1 and 806599.");
        return;
    }

    predictBtn.disabled = true;
    predictBtn.innerText = "Analysing Vehicle...";
    result.classList.remove("show");

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(carData)
        });

        if (!response.ok) {
            const errorData = await response.text();
            throw new Error("API Error " + response.status + ": " + errorData);
        }

        const data = await response.json();

        if (typeof data.predicted_price !== "number") {
            throw new Error("Invalid prediction received from the server.");
        }

        showResult(
            "Estimated Resale Value",
            "₹" + data.predicted_price.toLocaleString("en-IN", {
                maximumFractionDigits: 0
            }),
            "Prediction generated by your trained machine learning model. This is an estimate, not a guaranteed market price."
        );

    } catch (error) {
        showResult(
            "Prediction Failed",
            "Unavailable",
            error.message + " Make sure your Python API is running.",
            true
        );

        console.error("Prediction error:", error);

    } finally {
        predictBtn.disabled = false;
        predictBtn.innerText = "Predict Car Price →";
    }
});

function showResult(label, price, message, isError = false) {
    resultLabel.innerText = label;
    resultPrice.innerText = price;
    resultMessage.innerText = message;
    resultPrice.classList.toggle("error", isError);

    result.classList.add("show");

    result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}
</script>
